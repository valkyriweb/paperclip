name: Docker

on:
  push:
    branches:
      - "master"
      - "bermont"
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # Bermont fork: build on self-hosted Mac mini (M1) for paperclip-specific
    # workflows. amd64-only — the lue-kube cluster runs amd64 and arm64
    # emulation on M1 (or on hosted runners) doubles build time for no gain.
    runs-on: ${{ github.ref == 'refs/heads/bermont' && fromJSON('["self-hosted", "macOS", "ARM64", "mac-mini", "paperclip"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    concurrency:
      group: docker-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=bermont,enable=${{ github.ref == 'refs/heads/bermont' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # bermont branch deploys to lue-kube (amd64 only). master keeps multi-arch.
          platforms: ${{ github.ref == 'refs/heads/bermont' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
